<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>To Do List</h1>

        id="todoInput"

      <button id="addBtn">추가</button>
    </div>

    <ul id="todoList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
